[tox]

# Django version vs Python version

#       3.9  3.10 3.11 3.12
# 3.0    x
# 3.1    x
# 3.2    x    x           
# 4.0    x    x           
# 4.1    x    x    x      
# 4.2    x    x    x    x 

# Django version vs Django REST Framework version

#       3.12 3.13 3.14 3.15 3.16
# 3.0    x    x    x
# 3.1    x    x    x
# 3.2         x    x
# 4.0         x    x
# 4.1              x
# 4.2                   x    x
# 5.0                   x    x
# 5.1                        x
# 5.2                        x
# 6.0                         

# DRF 3.12 is Py 3.9 only
# DRF 3.13 is Py 3.9 & 3.10

envlist =
    py39-django{3.0,3.1,3.2,4.0,4.1,4.2},
    py310-django{3.2,4.0,4.1,4.2},
    py311-django{4.1,4.2},
    py312-django4.2,

[default]

[testenv]
basepython =
    py39: python3.9
    py310: python3.10
    py311: python3.11
    py312: python3.12
deps =
    pytz
    mock
    celery
    python-dateutil
    djangorestframework
    django2.2: django<2.3
    django3.0: django<3.1
    django3.1: django<3.2
    django3.2: django<3.3
    django4.0: django<4.1
    django4.1: django<4.2
    django4.2: django<4.3
    file://{toxinidir}/sample_project/
setenv =
    PYTHONPATH={toxinidir}
    DJANGO_SETTINGS_MODULE=sample_project.settings
commands = {envbindir}/django-admin test turngeneration
