[tox]
envlist =
    py{310,311,312}-django{5.0,5.1,5.2},
    py313-django{5.1,5.2},
    py314-django{5.2},

[default]

[testenv]
basepython =
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14
deps =
    pytz
    mock
    celery
    python-dateutil
    djangorestframework
    django5.0: django<5.1
    django5.1: django<5.2
    django5.2: django<5.3
    django6.0: django<6.1
    file://{toxinidir}/sample_project/
setenv =
    PYTHONPATH={toxinidir}
    DJANGO_SETTINGS_MODULE=sample_project.settings
commands = {envpython} -Wd {envbindir}/django-admin test {posargs:turngeneration}
